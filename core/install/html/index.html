    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var agree = document.getElementById('agree');
        var button = document.getElementById('agree-btn');

        if (agree) {
          agree.addEventListener('change', function () {
            if (this.checked) {
              button.disabled = false;
              button.setAttribute('onclick', "window.location='" + <?php echo json_encode($install_entry, JSON_HEX_TAG|JSON_HEX_AMP|JSON_HEX_APOS|JSON_HEX_QUOT|JSON_UNESCAPED_UNICODE);?> + "?action=chenk&agree=1'");
            } else {
              button.disabled = true;
              button.removeAttribute('onclick');
            }
          });
        }
      });
    </script>

<script>
$('#authkeyForm').on('submit', function() {
    var jform = $(this);
    if (!window.confirm('确定更换 auth_key？所有用户和管理员会立即下线。')) return false;
    var jsubmit = $('#authkeySubmit');
    jsubmit.prop('disabled', true);
    $.xpost(jform.attr('action'), jform.serialize(), function(code, message) {
        if (code == 0) {
            // 结果只显示这一次（含新 api 令牌），不自动跳转；会话已清空，刷新后会回到登录页
            $('#authkeyResult').html(message + '<br><a href="' + location.href + '">重新登录</a>').removeClass('d-none');
            jform.remove();
        } else {
            $.alert(message);
            jsubmit.prop('disabled', false);
        }
    });
    return false;
});
</script>

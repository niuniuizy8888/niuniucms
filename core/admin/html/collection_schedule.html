<div class="modal fade" id="scheduleModal" tabindex="-1" aria-labelledby="scheduleTitle"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content">
 <div class="modal-header"><h5 class="modal-title" id="scheduleTitle">定时采集</h5><button type="button" class="cw-close" data-bs-dismiss="modal" aria-label="关闭定时采集" title="关闭"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
 <div class="modal-body">
  <p class="text-muted">把下面的命令复制到宝塔，就能按时自动采集。只采集你已选择并绑定的分类。</p>
  <label for="scheduleHours" class="form-label">采集最近更新</label><select id="scheduleHours" class="form-select mb-3"><option value="24">最近 24 小时</option><option value="168">最近 7 天</option><option value="1">最近 1 小时</option></select>
  <div class="alert alert-info">执行命令后会自动开始采集，无需填写 PHP 或网站目录。采集完成后，宝塔日志会显示任务编号和结果。</div>
  <label class="form-label" for="scheduleCommand">计划任务命令</label><textarea id="scheduleCommand" class="form-control" rows="4" readonly></textarea>
  <div class="d-flex align-items-center gap-3 mt-3"><button type="button" class="btn btn-primary" id="copySchedule">复制命令</button><span id="copyScheduleResult" class="small text-muted" role="status"></span></div>
  <ol class="small mt-3 mb-2"><li>打开宝塔「计划任务」，任务类型选择「Shell 脚本」。</li><li>粘贴命令，设置执行周期，建议每小时一次。</li><li>保存后点击「执行」，到后台「任务管理」查看采集结果。</li></ol>
  <p class="small text-muted mb-0">已有旧命令时，请替换为上面的新命令。网络中断后再次执行可继续采集，无需一直打开后台页面。</p>
 </div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">关闭</button></div>
</div></div></div>
<script>
(function(){
var code='',modal=document.getElementById('scheduleModal');
// 从当前页面保留公网协议、端口和安装目录，避免反代传给 PHP 的 Host 丢失端口。
var base=new URL('.',window.location.href).href.replace(/\/$/,'');
var token=<?php echo json_encode(api_wire_token('api'),JSON_HEX_TAG|JSON_HEX_AMP|JSON_HEX_APOS|JSON_HEX_QUOT); ?>;
// 部分宝塔版本的非 root 任务用 bash -c 单引号包住整条命令；参数用双引号并转义 shell 展开字符。
function quote(s){return '"'+s.replace(/[\\"$`]/g,'\\$&')+'"';}
function command(){
 var hours=document.getElementById('scheduleHours').value;
 var endpoint=(base+'/api.php?route=collect&code='+encodeURIComponent(code)+'&h='+hours).replace(/'/g,'%27');
 document.getElementById('scheduleCommand').value='curl -fsSL --connect-timeout 15 --max-time 3600 --max-redirs 10000 -H '+quote('X-NNCMS-Token: '+token)+' '+quote(endpoint);
 document.getElementById('copyScheduleResult').textContent='';
}
modal.addEventListener('show.bs.modal',function(e){if(!e.relatedTarget)return;code=e.relatedTarget.dataset.source;document.getElementById('scheduleTitle').textContent=e.relatedTarget.dataset.name+' · 定时采集';command();});
document.getElementById('scheduleHours').addEventListener('change',command);
document.getElementById('copySchedule').addEventListener('click',function(){command();var field=document.getElementById('scheduleCommand'),result=document.getElementById('copyScheduleResult');function fallback(){field.select();result.textContent='请按 Ctrl+C 复制';}if(!navigator.clipboard){fallback();return;}navigator.clipboard.writeText(field.value).then(function(){result.textContent='已复制，请替换宝塔中的旧命令';}).catch(fallback);});
})();
</script>

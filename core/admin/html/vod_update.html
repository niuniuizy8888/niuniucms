<script>
document.addEventListener('DOMContentLoaded', function () {
    var btn = document.getElementById('upload_poster_btn');
    var fileInput = document.getElementById('poster_pic_file');
    var picInput = document.getElementById('pic_slide');
    if (!btn || !fileInput || !picInput) return;
    btn.addEventListener('click', function () { fileInput.click(); });
    fileInput.addEventListener('change', async function () {
        var file = fileInput.files && fileInput.files[0];
        if (!file) return;
        try {
            var vid = btn.getAttribute('data-vid') || '0';
            var formData = new FormData();
            formData.append('poster_pic', file);
            formData.append('safe_token', <?php echo json_encode($safe_token ?? '', JSON_HEX_TAG|JSON_HEX_AMP|JSON_HEX_APOS|JSON_HEX_QUOT|JSON_UNESCAPED_UNICODE);?>);
            var resp = await fetch(<?php echo json_encode($conf['admin_entry'] ?? 'admin.php', JSON_HEX_TAG|JSON_HEX_AMP|JSON_HEX_APOS|JSON_HEX_QUOT|JSON_UNESCAPED_UNICODE);?> + '?0=vod&1=uploadposterpic&vid=' + vid, { method: 'POST', body: formData, headers: {'X-Requested-With': 'XMLHttpRequest'} });
            var text = await resp.text();
            var s = null;
            try { s = JSON.parse(text); } catch (e) {}
            if (!s || s.code === undefined) { $.alert('上传失败：' + xn.htmlspecialchars(text)); return; }
            if (s.code != 0) { $.alert(s.message || '上传失败'); return; }
            if (s.url) picInput.value = s.url;
        } catch (e) { $.alert('上传失败：' + e); }
        finally { fileInput.value = ''; }
    });
});
</script>

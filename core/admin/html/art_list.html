<script>
var jconfirm = $("#confirm");
var jbatch = $("#batch_submit");
var jbatchAction = $("#batch_action");
var jartlist = $('#artlist');
var jcheckall = $('.checkall');
function artRowCheckboxes() {
    return jartlist.find('input[name="delete"]');
}
function selectedArtIds() {
    return artRowCheckboxes().filter(function(){ return this.checked; }).map(function(){ return $(this).val(); }).get();
}
function executeArtBatch(action) {
    var ids = selectedArtIds();
    if(ids.length < 1) { window.showToast(<?php echo json_encode(lang('please_check_delete_art'), JSON_HEX_TAG|JSON_HEX_AMP|JSON_HEX_APOS|JSON_HEX_QUOT|JSON_UNESCAPED_UNICODE);?>, 'warning'); return; }
    if(action == 'delete' && !window.confirm(<?php echo json_encode(lang('art_delete_confirm'), JSON_HEX_TAG|JSON_HEX_AMP|JSON_HEX_APOS|JSON_HEX_QUOT|JSON_UNESCAPED_UNICODE);?>)) return false;
    $.xpost(xn.url('art-batch', '', true), {ids: ids.join(','), batch_action: action, safe_token: <?php echo json_encode($safe_token ?? '', JSON_HEX_TAG|JSON_HEX_AMP|JSON_HEX_APOS|JSON_HEX_QUOT|JSON_UNESCAPED_UNICODE);?>}, function (code, message) {
        if (code == 0) {
            $.alert(message, 1);
            window.setTimeout(function(){ window.location.reload(); }, 800);
        } else {
            $.alert(message);
        }
    });
}
jconfirm.on('click', function(){ executeArtBatch('delete'); });
jbatch.on('click', function () {
    var action = jbatchAction.val();
    if(!action) { window.showToast('请选择批量操作', 'warning'); return; }
    executeArtBatch(action);
});
$('body').on('click', 'a.del-one', function(){
    if(!window.confirm('确定删除吗？')) return false;
    var aid = $(this).data('aid'), jtr = $(this).parents('tr');
    $.xpost(xn.url('art-del', '', true), {aid: aid, safe_token: <?php echo json_encode($safe_token ?? '', JSON_HEX_TAG|JSON_HEX_AMP|JSON_HEX_APOS|JSON_HEX_QUOT|JSON_UNESCAPED_UNICODE);?>}, function(code, message){
        if(code == 0){ jtr.remove(); syncBatchBar(); } else { $.alert(message); }
    });
    return false;
});

/* 批量浮条联动（v6.3） */
function syncBatchBar() {
    var ids = selectedArtIds();
    var jrows = artRowCheckboxes();
    var total = jrows.length;
    $('#batchCount').text(ids.length);
    $('#batchBar').toggleClass('show', ids.length > 0);
    jcheckall.prop('disabled', total === 0);
    jcheckall.prop('checked', total > 0 && ids.length === total);
    jcheckall.prop('indeterminate', ids.length > 0 && ids.length < total);
}
jartlist.on('change', 'input[name="delete"]', syncBatchBar);
jcheckall.on('change', function () {
    if (this.disabled) return;
    artRowCheckboxes().prop('checked', this.checked);
    syncBatchBar();
});
$('#batch_cancel').on('click', function () {
    artRowCheckboxes().prop('checked', false);
    jcheckall.prop('checked', false).prop('indeterminate', false);
    syncBatchBar();
});
syncBatchBar();
</script>

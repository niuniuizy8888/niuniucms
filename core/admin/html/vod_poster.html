<script>
$('.mod-button button').each(function () {
    var modal_url = $(this).attr('data-modal-url');
    if (url_rewrite_on < 2) $(this).attr('data-modal-url', '../' + modal_url);
});
$('select[name="cid"]').val(<?php echo intval($cid);?>).on('change', function() {
    window.location = xn.url('vod-list', {cid:$(this).val()}, true);
});
/* 单条删除：与 vod_list.html 同口径（POST + admin_vod_batch 令牌）。
   历史写法是 GET 链接且不带令牌，而后端 del 路由要求 POST，点击恒回「请求方式错误」。 */
$('body').on('click', 'a.del-one', function(){
    if(!window.confirm("确定删除吗？")) return false;
    var vid = $(this).data('vid'), jtr = $(this).parents('tr');
    $.xpost(xn.url('vod-del', '', true), {vid: vid, safe_token: <?php echo json_encode((string)($safe_token ?? ''), JSON_HEX_TAG|JSON_HEX_AMP|JSON_HEX_APOS|JSON_HEX_QUOT|JSON_UNESCAPED_UNICODE);?>}, function(code, message){
        if(code == 0){ jtr.remove(); } else { $.alert(message); }
    });
    return false;
});
var jconfirm = $("#confirm");
var jvodlist = $('#vodlist');
jconfirm.on('click', function(){
    var jchecked = jvodlist.find('input[name="delete"]').filter(function(){ return this.checked; });
    if(jchecked.length < 1) { window.showToast("请选择要删除的视频", 'warning'); return; }
    if(!window.confirm("确定删除吗？")) return false;
    jchecked.each(function() {
        var vid = $(this).parents('tr').attr('vid');
        // 审计修复：缺 safe_token 致 vod-del（admin_vod_batch 场景校验）必报非法操作
        $.xpost(xn.url('vod-del', '', true), {vid: vid, safe_token: <?php echo json_encode((string)($safe_token ?? ''), JSON_HEX_TAG|JSON_HEX_AMP|JSON_HEX_APOS|JSON_HEX_QUOT|JSON_UNESCAPED_UNICODE);?>}, function (code, message) {
            if (code == 0) { window.location.reload(); }
            else { $.alert(message); }
        });
    });
});
</script>

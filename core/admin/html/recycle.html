<script>
$(function(){
    $('form[data-confirm]').on('submit', function(){
        return confirm($(this).attr('data-confirm'));
    });
    $('#btn-purge-all').on('click', function(){
        if (!confirm('确认清空回收站？所有记录将不可恢复！')) return;
        $.xpost($(this).attr('data-url'), {safe_token: $(this).attr('data-token'), type: 0, id: 0}, function(code, json){
            if (code == 0) { location.reload(); }
        });
    });
});

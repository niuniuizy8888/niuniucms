<script>
var body = $('body');
body.on('click', '.install, .uninstall, .down', function () {
    var jthis = $(this);
    var href = jthis.data('href') || jthis.attr('href');
    var token = jthis.hasClass('down') ? '<?php echo $safe_token_down??''; ?>' : '<?php echo $safe_token??''; ?>';
    $.xpost(href, {safe_token: token}, function (code, message) {
        if (code == 0) { $.alert(message).delay(1000).location(); }
        else { $.alert(message); }
    });
    return false;
});
</script>

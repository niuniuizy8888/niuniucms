<script>
document.getElementById('select-all').addEventListener('change', function() {
    document.querySelectorAll('.group-checkbox').forEach(function(cb) { cb.checked = this.checked; }.bind(this));
});
function batchMerge(type) {
    var checkboxes = document.querySelectorAll('.group-checkbox:checked');
    if (checkboxes.length === 0) { window.showToast('请选择要合并的视频组', 'warning'); return; }
    var groups = [];
    checkboxes.forEach(function(cb) {
        groups.push({ group_vid: cb.value, vids: cb.dataset.vids });
    });
    if (confirm('确定要执行批量合并操作吗？')) {
        document.getElementById('merge-action').value = type === 'max' ? 'batch_merge_max' : 'batch_merge_min';
        document.getElementById('merge-groups').value = encodeURIComponent(JSON.stringify(groups));
        document.getElementById('merge-form').submit();
    }
}
</script>

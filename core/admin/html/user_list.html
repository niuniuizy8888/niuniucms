<script>
var jkeyword = $('#keyword');
jkeyword.on('keydown', function(e) {
    if(e.keyCode == 13) {
        var kw = jkeyword.val();
        if (kw) window.location = xn.url('user-list', {keyword: xn.urlencode(kw)}, true);
    }
});
$('#userlist').on('click', '.delete-user', function() {
    var uid = $(this).data('uid');
    if(uid == 1) { window.showToast('<?php echo lang('user_admin_cant_be_deleted');?>', 'warning'); return; }
    if(!window.confirm("<?php echo lang('user_delete_confirm');?>")) return false;
    $.xpost(xn.url('user-delete', '', true), {uid: uid, safe_token: '<?php echo $safe_token;?>'}, function (code, message) {
        if (code == 0) { window.location.reload(); }
        else { $.alert(message); }
    });
});
$('#search').on('click', function() {
    var kw = jkeyword.val();
    if (kw) {
        window.location = xn.url('user-list', {keyword: xn.urlencode(kw)}, true);
    } else {
        window.location = xn.url('user-list', '', true);
    }
});
</script>

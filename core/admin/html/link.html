<script>
var body = $('body');
body.on('click', 'button.create', function() {
    var name = $('input[name="name"]').val();
    var url = $('input[name="url"]').val();
    $.xpost(xn.url('link', '', true), {name:name,url:url,type:1,safe_token:<?php echo json_encode($safe_token ?? '', JSON_HEX_TAG|JSON_HEX_AMP|JSON_HEX_APOS|JSON_HEX_QUOT|JSON_UNESCAPED_UNICODE);?>}, function(code, message) {
        if(code == 0) { window.location.reload(); }
        else { $.alert(message); }
    });
    return false;
});
body.on('click', 'a.delete', function() {
    if (window.confirm('确定删除吗？')) {
        var href = $(this).data('href');
        $.xpost(href, {type:0,safe_token:<?php echo json_encode($safe_token ?? '', JSON_HEX_TAG|JSON_HEX_AMP|JSON_HEX_APOS|JSON_HEX_QUOT|JSON_UNESCAPED_UNICODE);?>}, function(code, message) {
            if(code == 0) { window.location.reload(); }
            else { $.alert(message); }
        });
    }
    return false;
});
body.on('click', 'button.rank', function () {
    var rankarr = new Array();
    $('input[name="rank"]').each(function(){
        var id = parseInt($(this).attr('id'), 10);
        var oldrank = parseInt($(this).attr('rank'), 10);
        var rank = parseInt($(this).val(), 10);
        rankarr.push({id:id,oldrank:oldrank,rank:rank});
    });
    $.xpost(xn.url('link','', true), {type:2,data:rankarr,safe_token:<?php echo json_encode($safe_token ?? '', JSON_HEX_TAG|JSON_HEX_AMP|JSON_HEX_APOS|JSON_HEX_QUOT|JSON_UNESCAPED_UNICODE);?>}, function (code, message) {
        if (code == 0) {
            $.alert(message);
            setTimeout(function() { window.location.reload(); }, 1000);
        } else { $.alert(message); }
    });
});
</script>

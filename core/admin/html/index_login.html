    <script>
    var jform = $('#form');
    jform.on('submit', function() {
        jform.reset();
        var jsubmit = jform.find('#submit');
        jsubmit.button('loading');
        var postdata = jform.serializeObject();
        $.xpost(jform.attr('action'), postdata, function(code, message, res) {
            if(code == 0) {
                jsubmit.button(message);
                /* 登录成功后的跳转：服务端 message(jump()) 把跳转脚本放在 res.jump_script
                   （URL 已在 core/func/misc.php::message() 做站内白名单校验）。
                   原实现无参调用 .location() 只是 reload 登录页 →「登录成功却回到登录表单」；
                   有 jump_script 就执行它（$().append 会自动执行脚本），否则退回当前入口地址。 */
                if (res && res.jump_script) {
                    $('body').append(res.jump_script);
                } else {
                    jsubmit.delay(1000).location(window.location.pathname);
                }
            }
            else { $.alert(message); jsubmit.button('reset'); }
        });
        return false;
    });
    </script>

<script>
(function () {
    'use strict';
    const initial = <?php echo json_encode(['state'=>$review_state,'data'=>$review_result,'cats'=>$review_categories,'token'=>$safe_token,'endpoint'=>url('vod-category_review','',true),'edit'=>url('vod-update','',true)], JSON_HEX_TAG|JSON_HEX_AMP|JSON_HEX_APOS|JSON_HEX_QUOT|JSON_UNESCAPED_UNICODE); ?>;
    const el = id => document.getElementById('review-' + id);
    let state = initial.state, token = initial.token, page = initial.data.page, running = false, busy = false;
    const categoryMap = new Map(initial.cats.map(c => [Number(c.cid), c]));
    function path(cid) {
        const parts = [], seen = new Set();
        while (categoryMap.has(Number(cid)) && !seen.has(Number(cid))) {
            const c = categoryMap.get(Number(cid)); seen.add(Number(cid));
            parts.unshift(c.name); cid = c.cup;
        }
        return parts.join(' / ');
    }
    function controls() {
        el('source').disabled = busy || running; el('all').disabled = busy || running;
        el('refresh').disabled = busy || running;
        if (el('start')) {
            el('start').disabled = busy || running || !el('source').value;
            el('resume').disabled = busy || running || !state.run || state.done;
            el('pause').disabled = !running;
        }
    }
    function progress() {
        el('progress').textContent = state.run
            ? (running ? '正在核对' : state.done ? '核对完成' : '已暂停') + ' · 已处理 ' + Math.max(0, Number(state.next)-1) + ' / ' + (state.pages || '?') + ' 页 · 已检查 ' + state.checked + ' 条资源 · 关联 ' + state.matched + ' 条记录'
            : '请选择资源站开始核对历史影片。';
    }
    function render(data) {
        page = data.page; el('rows').replaceChildren();
        data.rows.forEach(row => {
            const tr = document.createElement('tr');
            function cell(text) { const td = document.createElement('td'); td.textContent = text; tr.appendChild(td); return td; }
            const title = cell(''); const link = document.createElement('a');
            link.href = initial.edit + (initial.edit.includes('?') ? '&' : '?') + 'vid=' + Number(row.vid); link.textContent = '#' + row.vid + ' ' + row.name; title.appendChild(link);
            cell(row.source_name + ' · 资源 ' + row.remote_id + '\n' + (row.type_path || row.type_name) + '（分类 ' + row.type_id + '）').style.whiteSpace = 'pre-line';
            cell(row.local_path); cell(row.status);
            const actions = cell(''); const select = document.createElement('select'); select.className = 'form-control mb-2'; select.setAttribute('aria-label', '为' + row.name + '选择分类');
            initial.cats.forEach(c => { const opt = document.createElement('option'); opt.value = c.cid; opt.textContent = path(c.cid); select.appendChild(opt); });
            select.value = Number(row.pending) && Number(row.suggested_cid) ? row.suggested_cid : row.cid;
            const button = document.createElement('button'); button.type = 'button'; button.className = 'btn btn-primary btn-sm'; button.textContent = '确认此片及分类';
            button.addEventListener('click', async () => {
                if (busy || running) return;
                if (!window.confirm('确认资源 ' + row.remote_id + ' 对应《' + row.name + '》，并将本片分类设为“' + path(select.value) + '”？原播放地址会保留。')) return;
                await action({operation:'confirm', source:row.source, remote_id:row.remote_id, vid:row.vid, cid:select.value});
                if (row.source !== el('source').value) await action({operation:'list'});
            });
            actions.append(select, button); el('rows').appendChild(tr);
        });
        if (!data.rows.length) { const tr=document.createElement('tr'),td=document.createElement('td'); td.colSpan=5; td.textContent='当前筛选没有待核对记录；未扫描的资源需要先执行核对。'; tr.appendChild(td); el('rows').appendChild(tr); }
        el('pages').textContent = '第 ' + data.page + ' / ' + data.pages + ' 页 · 共 ' + data.total + ' 条来源记录';
        el('prev').disabled = data.page <= 1; el('next').disabled = data.page >= data.pages;
    }
    async function action(params) {
        if (busy) return false;
        busy = true; controls(); el('message').textContent = '';
        try {
            const body = new URLSearchParams(Object.assign({source:el('source').value, page, all:el('all').checked ? 1 : 0, safe_token:token}, params));
            const response = await fetch(initial.endpoint, {method:'POST', body, headers:{'X-Requested-With':'XMLHttpRequest'}});
            token = response.headers.get('X-NNCMS-CSRF-Token') || token;
            const result = await response.json();
            if (!response.ok || result.code !== 0) throw new Error(result.message || result.msg || '本次请求失败，请重试');
            state = result.state; render(result.data); return true;
        } catch (err) { running = false; el('message').textContent = err.message || '请求失败，已保存的进度仍可继续'; return false; }
        finally { busy = false; progress(); controls(); }
    }
    async function collect(start) {
        running = true; controls();
        if (start && !await action({operation:'start'})) return;
        while (running && !state.done) {
            if (!await action({operation:'scan', run:state.run})) break;
            await new Promise(resolve => setTimeout(resolve, 150));
        }
        running = false; progress(); controls();
    }
    if (el('start')) {
        el('start').addEventListener('click', () => collect(true));
        el('resume').addEventListener('click', () => collect(false));
        el('pause').addEventListener('click', () => { running=false; progress(); controls(); });
    }
    el('source').addEventListener('change', () => { page=1; action({operation:'list'}); });
    el('all').addEventListener('change', () => { page=1; action({operation:'list'}); });
    el('refresh').addEventListener('click', () => action({operation:'list'}));
    el('prev').addEventListener('click', () => { if (!busy) action({operation:'list',page:page-1}); });
    el('next').addEventListener('click', () => { if (!busy) action({operation:'list',page:page+1}); });
    render(initial.data); progress(); controls();
})();
</script>

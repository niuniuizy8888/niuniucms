<script>
var jform = $('#form');
jform.on('submit', function() {
    jform.reset();
    var jthis = $(this);
    var jsubmit = jthis.find('#submit');
    jsubmit.button('loading');
    var postdata = jform.serialize();
    $.xpost(jform.attr('action'), postdata, function(code, message) {
        if(code == 0) { $.alert(message); jsubmit.text(message).delay(1000).location(); }
        else if(xn.is_number(code)) { $.alert(message); jsubmit.button('reset'); }
        else { jform.find('[name="'+code+'"]').fieldAlert(message).focus(); jsubmit.button('reset'); }
    });
    return false;
});
</script>

<script>
var ADMIN_BASE = '<?php echo htmlspecialchars($conf['admin_entry'] ?? 'admin.php', ENT_QUOTES, 'UTF-8'); ?>?';
function apiDo(ep){
  if(!window.confirm('确定执行该操作吗？')) return false;
  $.xpost(xn.url(ep, '', true), {safe_token:'<?php echo $safe_token??''; ?>'}, function(code, message){
    $.alert(message);
    if(code==0){ setTimeout(function(){ window.location.reload(); }, 800); }
  });
  return false;
}
  document.addEventListener("DOMContentLoaded", function () {
    var bindModal = document.getElementById("artBindModal");
    var contentDiv = document.getElementById("art-bind-content");
    var loadingDiv = document.getElementById("art-bind-loading");
    var csrfToken = '<?php echo $safe_token??''; ?>';

    function refreshCategoryData(code) {
      contentDiv.classList.add("d-none");
      loadingDiv.classList.remove("d-none");
      loadingDiv.textContent = "正在加载分类数据...";
      contentDiv.innerHTML = "";
      fetch(ADMIN_BASE + "0=api&1=cate&model=1&code=" + encodeURIComponent(code))
        .then(function(r){ return r.json(); })
        .then(function(data) {
          if (data && data.safe_token) csrfToken = data.safe_token;
          loadingDiv.classList.add("d-none");
          contentDiv.classList.remove("d-none");
          function escapeHtml(s) {
            s = String(s == null ? '' : s);
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
          }
          var api_type = data.api_type || [], cate = data.cate || {}, bind = data.bind || {};
          var html = "<div class=\"container-fluid\"><div class=\"row g-3\">";
          api_type.forEach(function(item) {
            var typeName = item.type_name;
            var boundId = bind[typeName] || "";
            var localExist = Object.prototype.hasOwnProperty.call(cate, typeName);
            html += "<div class=\"col-md-3 col-sm-6\"><div class=\"card p-3\"><div class=\"fw-bold mb-2\">" + escapeHtml(typeName) + "</div>";
            if (localExist) {
              html += "<select class=\"form-select form-select-sm mb-1 local-cate\" data-type-name=\"" + escapeHtml(typeName) + "\"><option value=\"\">选择文章分类</option>";
              for (var n in cate) {
                if (Object.prototype.hasOwnProperty.call(cate, n)) {
                  html += "<option value=\"" + escapeHtml(cate[n]) + "\"" + (cate[n]==boundId?" selected":"") + ">" + escapeHtml(n) + "</option>";
                }
              }
              html += "</select><small class=\"" + (boundId?"text-success":"text-muted") + "\">" + (boundId?"已绑定":"未绑定") + "</small>";
              if (boundId) html += "<button class=\"btn btn-sm btn-danger btn-unbind mt-2 w-100\">解绑</button>";
            } else {
              html += "<small class=\"text-muted\">本地未创建文章分类</small><button class=\"btn btn-warning btn-sm btn-create w-100 mt-2\" data-type-name=\"" + escapeHtml(typeName) + "\">创建文章分类</button>";
            }
            html += "</div></div>";
          });
          html += "</div></div>";
          contentDiv.innerHTML = html;
        }).catch(function(err) {
          loadingDiv.textContent = "加载失败";
          console.error(err);
        });
    }

    if (bindModal) {
      bindModal.addEventListener("show.bs.modal", function (event) {
        var btn = event.relatedTarget;
        if (!btn) return;
        bindModal.dataset.code = btn.getAttribute("data-code");
        refreshCategoryData(bindModal.dataset.code);
      });

      contentDiv.addEventListener("click", function (e) {
        var t = e.target, code = bindModal.dataset.code;
        if (!code) return;
        if (t.classList.contains("btn-unbind")) {
          var tn = t.closest(".card").querySelector("select").dataset.typeName;
          fetch(ADMIN_BASE + "0=api&1=cate", {method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"binstatus=unbind&code="+encodeURIComponent(code)+"&type_name="+encodeURIComponent(tn)+"&safe_token="+encodeURIComponent(csrfToken)})
            .then(function(r){return r.json()})
            .then(function(d){if(d.success)refreshCategoryData(code);else $.alert(d.msg||"解绑失败")})
            .catch(function(err){ console.error(err); $.alert("解绑失败"); });
        }
        if (t.classList.contains("btn-create")) {
          fetch(ADMIN_BASE + "0=api&1=newcreate", {method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"type_name="+encodeURIComponent(t.dataset.typeName)+"&model=1&safe_token="+encodeURIComponent(csrfToken)})
            .then(function(r){return r.json()})
            .then(function(d){if(d.success){refreshCategoryData(code);$.alert("文章分类创建成功")}else $.alert(d.msg||"创建失败")})
            .catch(function(err){ console.error(err); $.alert("创建失败"); });
        }
      });

      contentDiv.addEventListener("change", function(e) {
        if (!e.target.classList.contains("local-cate")) return;
        var s = e.target, code = bindModal.dataset.code, localId = s.value;
        fetch(ADMIN_BASE + "0=api&1=cate", {method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"binstatus="+(localId?"bind":"unbind")+"&code="+encodeURIComponent(code)+"&type_name="+encodeURIComponent(s.dataset.typeName)+"&local_id="+encodeURIComponent(localId||"")+"&safe_token="+encodeURIComponent(csrfToken)})
          .then(function(r){return r.json()})
          .then(function(d){if(d.success)refreshCategoryData(code);else $.alert(d.msg||"操作失败")})
          .catch(function(err){ console.error(err); $.alert("操作失败"); });
      });
    }
  });
</script>

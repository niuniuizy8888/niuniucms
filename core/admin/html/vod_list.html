<script>
$('.mod-button button').each(function () {
    var modal_url = $(this).attr('data-modal-url');
    if (url_rewrite_on < 2) $(this).attr('data-modal-url', '../' + modal_url);
});

var jconfirm = $("#confirm");
var jbatch = $("#batch_submit");
var jbatchAction = $("#batch_action");
var jvodlist = $('#vodlist');
function selectedVodIds() {
    return jvodlist.find('input[name="delete"]').filter(function(){ return this.checked; }).map(function(){ return $(this).val(); }).get();
}
function executeVodBatch(action) {
    var ids = selectedVodIds();
    if(ids.length < 1) { window.showToast("<?php echo lang('please_check_delete_vod');?>", 'warning'); return; }
    if(action == 'delete' && !window.confirm("<?php echo lang('vod_delete_confirm');?>")) return false;
    $.xpost(xn.url('vod-batch', '', true), {ids: ids.join(','), batch_action: action, safe_token: '<?php echo $safe_token; ?>'}, function (code, message) {
        if (code == 0) {
            $.alert(message, 1);
            window.setTimeout(function(){ window.location.reload(); }, 800);
        } else {
            $.alert(message);
        }
    });
}
jconfirm.on('click', function(){ executeVodBatch('delete'); });
jbatch.on('click', function () {
    var action = jbatchAction.val();
    if(!action) { window.showToast('请选择批量操作', 'warning'); return; }
    executeVodBatch(action);
});
$('body').on('click', 'a.del-one', function(){
    if(!window.confirm("<?php echo lang('vod_delete_confirm');?>")) return false;
    var vid = $(this).data('vid'), jtr = $(this).parents('tr');
    $.xpost(xn.url('vod-del', '', true), {vid: vid, safe_token: '<?php echo $safe_token??''; ?>'}, function(code, message){
        if(code == 0){ jtr.remove(); } else { $.alert(message); }
    });
    return false;
});

/* 批量浮条联动（v6.3） */
function syncBatchBar() {
    var ids = selectedVodIds();
    $('#batchCount').text(ids.length);
    $('#batchBar').toggleClass('show', ids.length > 0);
    var total = jvodlist.find('input[name="delete"]').length;
    if (total) $('.checkall').prop('checked', ids.length === total);
}
jvodlist.on('change', 'input[name="delete"]', syncBatchBar);
$(document).on('change', '.checkall', function () { setTimeout(syncBatchBar, 0); });
$('#batch_cancel').on('click', function () {
    jvodlist.find('input[name="delete"]:checked').prop('checked', false);
    $('.checkall').prop('checked', false);
    syncBatchBar();
});
</script>

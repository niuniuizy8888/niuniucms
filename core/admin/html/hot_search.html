<script>
var body = $('body');
body.on('click', 'a.delete', function() {
    var id = $(this).attr('data-id');
    $.xpost(xn.url('hot-search', '', true), {type:1,id:id,safe_token:'<?php echo $safe_token??''; ?>'}, function(code, message) {
        if(code == 0) { window.location.reload(); }
        else { $.alert(message); }
    });
});
body.on('click', 'button.clear-all', function() {
    if(!window.confirm('确定清空全部搜索热词？该操作不可撤销')) return false;
    $.xpost(xn.url('hot-search', '', true), {type:2,safe_token:<?php echo json_encode($safe_token ?? '', JSON_HEX_TAG|JSON_HEX_AMP|JSON_HEX_APOS|JSON_HEX_QUOT|JSON_UNESCAPED_UNICODE);?>}, function(code, message) {
        if(code == 0) { window.location.reload(); }
        else { $.alert(message); }
    });
});
</script>

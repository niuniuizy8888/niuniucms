<script>
var jform = $("#form");
// 单页/频道切换：单页隐藏上级分类、显示正文；频道反之
function cateTypeToggle(){
    var isPage = ($("#cate_type").val() == "2");
    $("#parent_box").toggle(!isPage);
    $("#content_box").toggle(isPage);
}
$("#cate_type").on('change', cateTypeToggle);
jform.on('submit', function(){
    jform.reset();
    var jsubmit = jform.find('#submit');
    jsubmit.button('loading');
    var postdata = jform.serialize();
    $.xpost(jform.attr('action'), postdata, function(code, message) {
        if(code == 0) { $.alert(message); jsubmit.text(message).delay(1000).location(xn.url('cate-list', '', true)); }
        else { $.alert(message); jsubmit.button('reset'); }
    });
    return false;
});
</script>

<script>
var body = $('body');
var modal = $('#ad_manage');

body.on('click', 'button.create', function() {
    var name = modal.find('input[name=\"name\"]').val();
    var url = modal.find('input[name=\"url\"]').val();
    var img_url = modal.find('input[name=\"img_url\"]').val();
    var area = modal.find('input[name=\"area\"]:checked').val();
    var days = modal.find('input[name=\"days\"]').val();
    $.xpost(xn.url('ad', '', true), {name:name,url:url,img_url:img_url,area:area,days:days,type:1,safe_token:<?php echo json_encode($safe_token ?? '', JSON_HEX_TAG|JSON_HEX_AMP|JSON_HEX_APOS|JSON_HEX_QUOT|JSON_UNESCAPED_UNICODE);?>}, function(code, message) {
        if(code == 0) {
            window.location.reload();
        } else {
            $.alert(message);
        }
    });
    return false;
});
body.on('click', 'button.upload', function() {
    $('#ad_upload').val('');
    $('#ad_upload').trigger('click');
});
body.on('change', '#ad_upload', function() {
    var f = this.files && this.files[0] ? this.files[0] : null;
    if(!f) return;
    var reader = new FileReader();
    reader.onload = function(e) {
        var data = e.target.result;
        $.xpost(xn.url('ad', '', true), {type:3,data:data,filename:f.name,safe_token:<?php echo json_encode($safe_token ?? '', JSON_HEX_TAG|JSON_HEX_AMP|JSON_HEX_APOS|JSON_HEX_QUOT|JSON_UNESCAPED_UNICODE);?>}, function(code, message) {
            if(code == 0) {
                if(message && message.url) {
                    modal.find('input[name=\"img_url\"]').val(message.url);
                }
            } else {
                $.alert(message);
            }
        });
    };
    reader.readAsDataURL(f);
});
body.on('click', 'a.delete', function() {
    if (window.confirm('确定删除吗？')) {
        var href = $(this).data('href');
        $.xpost(href, {type:0,safe_token:<?php echo json_encode($safe_token ?? '', JSON_HEX_TAG|JSON_HEX_AMP|JSON_HEX_APOS|JSON_HEX_QUOT|JSON_UNESCAPED_UNICODE);?>}, function(code, message) {
            if(code == 0) {
                window.location.reload();
            } else {
                $.alert(message);
            }
        });
    }
    return false;
});

modal.on('hidden.bs.modal', function () {
    modal.find('input[name=\"name\"]').val('');
    modal.find('input[name=\"url\"]').val('');
    modal.find('input[name=\"img_url\"]').val('');
    modal.find('input[name=\"days\"]').val('30');
    modal.find('input[name=\"area\"]').prop('checked', false);
    modal.find('input[name=\"area\"][value=\"all\"]').prop('checked', true);
});
</script>

<script>
var body = $('body');
var modal = $('#ad_manage');
var safeToken = <?php echo json_encode($safe_token ?? '', JSON_HEX_TAG|JSON_HEX_AMP|JSON_HEX_APOS|JSON_HEX_QUOT|JSON_UNESCAPED_UNICODE);?>;

function adResetForm() {
    modal.find('input[name="id"]').val('0');
    modal.find('input[name="name"]').val('');
    modal.find('input[name="url"]').val('');
    modal.find('input[name="img_url"]').val('');
    modal.find('input[name="days"]').val('30');
    modal.find('input[name="area"]').prop('checked', false);
    modal.find('input[name="area"][value="all"]').prop('checked', true);
    modal.find('#ad_manage_label').text('添加广告');
    modal.data('mode', 'create');
}

function adShowModal() {
    if (window.bootstrap && bootstrap.Modal) {
        bootstrap.Modal.getOrCreateInstance(modal[0]).show();
    } else {
        modal.modal('show');
    }
}

body.on('click', 'a.ad-add', function() {
    adResetForm();
    adShowModal();
    return false;
});

body.on('click', 'a.edit', function() {
    var $a = $(this);
    var id = $a.attr('data-id') || '0';
    var name = $a.attr('data-name') || '';
    var url = $a.attr('data-url') || '';
    var imgUrl = $a.attr('data-img-url') || '';
    var area = $a.attr('data-area') || 'all';
    var endTime = parseInt($a.attr('data-end-time'), 10) || 0;
    var days = 0;
    if (endTime > 0) {
        days = Math.max(0, Math.ceil((endTime - (Date.now() / 1000)) / 86400));
    }
    modal.find('input[name="id"]').val(id);
    modal.find('input[name="name"]').val(name);
    modal.find('input[name="url"]').val(url);
    modal.find('input[name="img_url"]').val(imgUrl);
    modal.find('input[name="days"]').val(String(days));
    modal.find('input[name="area"]').prop('checked', false);
    if (modal.find('input[name="area"][value="' + area + '"]').length) {
        modal.find('input[name="area"][value="' + area + '"]').prop('checked', true);
    } else {
        modal.find('input[name="area"][value="all"]').prop('checked', true);
    }
    modal.find('#ad_manage_label').text('编辑广告');
    modal.data('mode', 'edit');
    adShowModal();
    return false;
});

body.on('click', 'button.create', function() {
    var name = modal.find('input[name="name"]').val();
    var url = modal.find('input[name="url"]').val();
    var img_url = modal.find('input[name="img_url"]').val();
    var area = modal.find('input[name="area"]:checked').val();
    var days = modal.find('input[name="days"]').val();
    var id = modal.find('input[name="id"]').val();
    var mode = modal.data('mode') || 'create';
    var payload = {name:name, url:url, img_url:img_url, area:area, days:days, safe_token:safeToken};
    if (mode === 'edit' && parseInt(id, 10) > 0) {
        payload.type = 2;
        payload.id = id;
    } else {
        payload.type = 1;
    }
    $.xpost(xn.url('ad', '', true), payload, function(code, message) {
        if(code == 0) {
            window.location.reload();
        } else {
            $.alert(message);
        }
    });
    return false;
});
body.on('click', 'button.upload', function() {
    $('#ad_upload').val('');
    $('#ad_upload').trigger('click');
});
body.on('change', '#ad_upload', function() {
    var f = this.files && this.files[0] ? this.files[0] : null;
    if(!f) return;
    var reader = new FileReader();
    reader.onload = function(e) {
        var data = e.target.result;
        $.xpost(xn.url('ad', '', true), {type:3,data:data,filename:f.name,safe_token:safeToken}, function(code, message) {
            if(code == 0) {
                if(message && message.url) {
                    modal.find('input[name="img_url"]').val(message.url);
                }
            } else {
                $.alert(message);
            }
        });
    };
    reader.readAsDataURL(f);
});
body.on('click', 'a.delete', function() {
    if (window.confirm('确定删除吗？')) {
        var href = $(this).data('href');
        $.xpost(href, {type:0,safe_token:safeToken}, function(code, message) {
            if(code == 0) {
                window.location.reload();
            } else {
                $.alert(message);
            }
        });
    }
    return false;
});

modal.on('hidden.bs.modal', function () {
    adResetForm();
});
</script>

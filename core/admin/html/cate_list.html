<script>
var jform = $("#form");
jform.on('submit', function(){
    jform.reset();
    var postdata = jform.serialize();
    var jsubmit = $(this).find('#submit');
    jsubmit.button('loading');
    $.xpost(jform.attr('action'), postdata, function(code, message) {
        if(code == 0) { $.alert(message); jsubmit.text(message).delay(1000).location(); }
        else { $.alert(message); jsubmit.button('reset'); }
    });
    return false;
});
$('table').on('click', 'a.delete', function() {
    var jthis = $(this);
    var href = $(this).data('href');
    var jtr = jthis.parents('tr');
    $.xpost(href, {safe_token: '<?php echo $safe_token??''; ?>'}, function (code, message) {
        if (code == 0) { jtr.remove(); }
        else { $.alert(message); }
    });
    return false;
});
</script>

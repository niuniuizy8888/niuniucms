<script>
var jform = $('#form');
jform.on('submit', function() {
    jform.reset();
    var jthis = $(this);
    var jsubmit = jthis.find('#submit');
    jsubmit.button('loading');
    var postdata = jform.serialize();
    $.xpost(jform.attr('action'), postdata, function(code, message, res) {
        jsubmit.button('reset');
        if(code == 0) {
            $.alert(message);
            /* 服务端 SetManageService::upgrade 返回 jump($msg, url('set-upgrade'), 3)，跳转脚本由
               misc.php::message() 白名单提取到 res.jump_script；$.xpost 已透传完整响应。
               这里执行它，修复"升级成功却停在原页"（原实现丢弃了服务端跳转意图）。 */
            if (res && res.jump_script) { $('body').append(res.jump_script); }
        }
        else { $.alert(message || '升级失败'); }
    });
    return false;
});
</script>

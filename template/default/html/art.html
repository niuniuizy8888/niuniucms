<!DOCTYPE html>
<html lang="zh-CN">
<head>
    {inc:public/include.html}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{$art.name}",
  "description": "{if:isset($seo['d']) && !empty($seo['d'])}{$seo.d}{/if}",
  "image": "{$art.pic}",
  {if:isset($cate) && !empty($cate['name'])}"articleSection": "{$cate.name}",{/if}
  {if:isset($seo['url']) && !empty($seo['url'])}"url": "{$seo.url}",{/if}
  {if:isset($art['create_date']) && !empty($art['create_date'])}"datePublished": "{if:isset($art['create_date_fmt'])}{$art.create_date_fmt}{/if}",{/if}
  "publisher": {
    "@type": "Organization",
    "name": "{$nncms.site_name}"
  }
}
</script>
</head>
<body class="overflow-y-auto overflow-x-hidden">
    <div class="relative w-full h-full flex flex-col scroll-pt-[6px]" style="align-items: center;">
        <div class="z-50 w-screen sticky top-0">
            {inc:public/head.html}
        </div>
        <div class="w-full grow flex justify-center">
            <div class="flex flex-col w-full">
                <div class="container mx-auto px-4 py-4">
                    <h1 class="text-2xl font-bold text-[var(--text-primary)] mb-4">{$art.name}</h1>
                    {inc:public/like.html}
                    <article class="prose-article mt-4 text-[var(--text-secondary)] leading-relaxed">
                        {$art.content}
                    </article>
                </div>
            </div>
        </div>
        {inc:public/foot.html}
    </div>
</body>
</html>

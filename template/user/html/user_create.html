<script>
$(function () {
    var jform = $('form.mb-3');
    jform.on('submit', function () {
        var jthis = $(this);
        var jsubmit = jthis.find('button[type="submit"]');
        jsubmit.prop('disabled', true);
        var postdata = jthis.serializeObject();
        $.xpost(jthis.attr('action'), postdata, function (code, message) {
            if (code == 0) {
                var referer = String(postdata.referer || '');
                $.alert(message || '注册成功');
                setTimeout(function () {
                    if (referer) {
                        window.location.href = referer;
                    } else {
                        window.location.reload();
                    }
                }, 1000);
            } else if (xn.is_number(code)) {
                $.alert(message);
                jsubmit.prop('disabled', false);
            } else {
                jthis.find('[name="' + code + '"]').fieldAlert(message).focus();
                jsubmit.prop('disabled', false);
            }
        });
        return false;
    });
});
</script>

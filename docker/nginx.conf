# NiuNiuCMS nginx (container). Aligns with .skills/deploy/nginx.conf.example denies.
server {
    listen 80 default_server;
    server_name _;
    root /var/www/nncms;
    index index.php index.html;

    client_max_body_size 64m;
    charset utf-8;

    location ~* ^/(config|core|data|tools|docker|lang|model|route|runtime|deploy|dev|install|tests|task|\.skills|\.domian|\.git|\.svn)(/|$) {
        deny all;
    }
    location ~* ^/template/[^/]+/html/ { deny all; }
    location ~* ^/(template|plugins|runtime)/.*\.php(/|$) { deny all; }
    location ~* ^/plugins/.+\.(php\d*|phtml|phar|pht|phps)$ { deny all; }
    location ~* ^/plugins/[^/]+/template/ { deny all; }
    location ~* \.php/ { deny all; }
    location ^~ /upload/ {
        autoindex off;
        location ~ /\. { deny all; }
        location ~* \.(php\d*|phtml|phar|pht|phps|bak|sql|log|env|sh|py|pl|cgi)$ { deny all; }
        location ~* \.svgz?$ {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy "same-origin" always;
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        }
    }
    location ~ /\. { deny all; }
    location = /Dockerfile { deny all; }
    location ~* \.(bak|old|tmp|swp|sql|log|lock|md|rdb|tar|gz|zip|json|ini|go|env|sh|py|key|pem|crt|dic|yml|yaml|conf)$ {
        deny all;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "same-origin" always;

    location = /install.php {
        if (-f /var/www/nncms/data/install.lock) { return 404; }
        if (-f /var/www/nncms/core/config/install.lock) { return 404; }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 120s;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|ico|css|js|woff2?|ttf|eot)$ {
        expires 7d;
        access_log off;
    }
}